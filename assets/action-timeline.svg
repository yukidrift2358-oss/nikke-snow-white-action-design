<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#65707b"/></marker></defs><rect width="1200" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="55" font-size="30" fill="#242931" font-weight="bold">关键动作时序</text><text x="44" y="91" font-size="17" fill="#65707b" font-weight="normal">逻辑步以 F1 起算，区间包含两端。取消先于本步动作事件处理。</text><text x="44" y="189" font-size="22" fill="#242931" font-weight="bold">换弹 / 90F</text><rect x="254" y="160" width="585" height="44" rx="1" fill="#f1f2f3" stroke="none"/><text x="261" y="188" font-size="15" fill="#242931" font-weight="normal">准备与装填</text><rect x="839" y="160" width="9" height="44" rx="1" fill="#b98a2d" stroke="none"/><text x="846" y="188" font-size="15" fill="white" font-weight="normal"></text><rect x="848" y="160" width="216" height="44" rx="1" fill="#f1f2f3" stroke="none"/><text x="855" y="188" font-size="15" fill="#242931" font-weight="normal">收尾</text><text x="254" y="232" font-size="17" fill="#65707b" font-weight="normal">F66 补弹；同一步闪避优先，本次不补弹。</text><text x="44" y="311" font-size="22" fill="#242931" font-weight="bold">闪避 / 30F</text><rect x="254" y="282" width="27" height="44" rx="1" fill="#f1f2f3" stroke="none"/><text x="261" y="310" font-size="15" fill="#242931" font-weight="normal"></text><rect x="281" y="282" width="81" height="44" rx="1" fill="#b98a2d" stroke="none"/><text x="288" y="310" font-size="15" fill="white" font-weight="normal">无敌</text><rect x="362" y="282" width="54" height="44" rx="1" fill="#f1f2f3" stroke="none"/><text x="369" y="310" font-size="15" fill="#242931" font-weight="normal"></text><rect x="416" y="282" width="108" height="44" rx="1" fill="#242931" stroke="none"/><text x="423" y="310" font-size="15" fill="white" font-weight="normal">可接动作</text><text x="254" y="354" font-size="17" fill="#65707b" font-weight="normal">F4–F12 无敌；F19 恢复出手；冷却从启动起共 48F。</text><text x="44" y="433" font-size="22" fill="#242931" font-weight="bold">重射 / 30F</text><rect x="254" y="404" width="45" height="44" rx="1" fill="#f1f2f3" stroke="none"/><text x="261" y="432" font-size="15" fill="#242931" font-weight="normal"></text><rect x="299" y="404" width="9" height="44" rx="1" fill="#b75040" stroke="none"/><text x="306" y="432" font-size="15" fill="white" font-weight="normal"></text><rect x="308" y="404" width="108" height="44" rx="1" fill="#242931" stroke="none"/><text x="315" y="432" font-size="15" fill="white" font-weight="normal">锁定</text><rect x="416" y="404" width="108" height="44" rx="1" fill="#b98a2d" stroke="none"/><text x="423" y="432" font-size="15" fill="white" font-weight="normal">可闪避</text><text x="254" y="476" font-size="17" fill="#65707b" font-weight="normal">F6 发射；该步若先接受闪避则不击发。F7–F18 不可取消。</text><text x="254" y="550" font-size="20" fill="#242931" font-weight="normal">完整满蓄：准备 24F + 蓄力 60F + 重射 30F = 114F（1.9s）</text><path d="M44,602 L1156,602" fill="none" stroke="#dedfe1" stroke-width="2" /><text x="44" y="630" font-size="15" fill="#65707b" font-weight="normal">白雪公主 · 第三人称动作设计提案  /  2.0  /  参数待原型试调</text></g></svg>