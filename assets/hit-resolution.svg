<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#65707b"/></marker></defs><rect width="1200" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="55" font-size="30" fill="#242931" font-weight="bold">枪口遮挡与命中结算</text><text x="44" y="91" font-size="17" fill="#65707b" font-weight="normal">准星可见不等于枪口可射；同一攻击对同一目标只结算一次。</text><rect x="80" y="180" width="190" height="190" rx="4" fill="#eceef0" stroke="none"/><text x="110" y="223" font-size="24" fill="#242931" font-weight="bold">玩家 / 枪口</text><text x="110" y="264" font-size="17" fill="#65707b" font-weight="normal">相机位于侧后</text><rect x="474" y="151" width="58" height="230" rx="4" fill="#242931" stroke="none"/><text x="462" y="410" font-size="20" fill="#242931" font-weight="normal">实体墙</text><rect x="922" y="180" width="210" height="180" rx="4" fill="#f1f2f3" stroke="none"/><text x="950" y="224" font-size="24" fill="#242931" font-weight="bold">目标</text><text x="950" y="266" font-size="19" fill="#242931" font-weight="normal">本体 + 弱点</text><path d="M262,160 L1025,160" fill="none" stroke="#b98a2d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5" /><text x="550" y="145" font-size="18" fill="#b98a2d" font-weight="normal">相机中心射线：获得期望瞄准点</text><path d="M270,287 L474,237" fill="none" stroke="#b75040" stroke-width="2" marker-end="url(#arrow)" /><text x="300" y="335" font-size="20" fill="#b75040" font-weight="normal">枪口射线被墙挡住</text><text x="730" y="337" font-size="19" fill="#242931" font-weight="normal">不扣目标生命 / 不回能</text><rect x="80" y="455" width="1052" height="74" rx="4" fill="#f1f2f3" stroke="none"/><text x="108" y="500" font-size="21" fill="#242931" font-weight="normal">attack_id + target_id 去重  →  取首个有效表面  →  伤害与回能各提交一次</text><path d="M44,572 L1156,572" fill="none" stroke="#dedfe1" stroke-width="2" /><text x="44" y="600" font-size="15" fill="#65707b" font-weight="normal">白雪公主 · 第三人称动作设计提案  /  2.0  /  参数待原型试调</text></g></svg>