<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="fovLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="alphaLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="scopeRing4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.98"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1F2937"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D4 ADS 瞄准过渡曲线 · FOV × 瞄准镜透明度</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">腰射 → 瞄准镜开镜  ·  0~20F 过渡动画  ·  FOV 75° 至 22° 平滑下降  ·  瞄准镜同步淡入</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 图例 -->
  <g transform="translate(60, 115)" font-size="12">
    <line x1="0" y1="10" x2="30" y2="10" stroke="url(#fovLine)" stroke-width="3"/>
    <circle cx="30" cy="10" r="4" fill="#4A7CC9"/>
    <text x="40" y="14" fill="#1F2937">FOV 视野角 (°)</text>
    <line x1="200" y1="10" x2="230" y2="10" stroke="url(#alphaLine)" stroke-width="3"/>
    <circle cx="230" cy="10" r="4" fill="#D4A853"/>
    <text x="240" y="14" fill="#1F2937">瞄准镜透明度 (%)</text>
    <rect x="450" y="2" width="18" height="18" rx="9" fill="none" stroke="#4A7CC9" stroke-width="1.5"/>
    <text x="475" y="16" fill="#1F2937">瞄准镜淡入阶段示意</text>
  </g>

  <!-- 上方 FOV 曲线图 -->
  <g transform="translate(60, 150)">
    <rect width="1080" height="230" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1F2937">上方曲线 · FOV 视野  75° → 22°</text>

    <!-- Y 轴 22-75 标记 -->
    <g font-size="11" fill="#6B7280">
      <line x1="60" y1="190" x2="60" y2="50" stroke="#D1D5DB" stroke-width="1"/>
      <text x="56" y="54" text-anchor="end">75°</text>
      <line x1="56" y1="50" x2="60" y2="50" stroke="#9CA3AF"/>
      <text x="56" y="100" text-anchor="end">60°</text>
      <line x1="56" y1="96" x2="60" y2="96" stroke="#D1D5DB"/>
      <text x="56" y="146" text-anchor="end">40°</text>
      <line x1="56" y1="142" x2="60" y2="142" stroke="#D1D5DB"/>
      <text x="56" y="192" text-anchor="end">22°</text>
      <line x1="56" y1="188" x2="60" y2="188" stroke="#9CA3AF"/>
    </g>

    <!-- X 轴 0~20F -->
    <g font-size="11" fill="#6B7280">
      <line x1="60" y1="190" x2="1050" y2="190" stroke="#D1D5DB" stroke-width="1" marker-end="url(#arr)"/>
      <g>
        <line x1="60" y1="190" x2="60" y2="195" stroke="#1F2937" stroke-width="1.5"/>
        <text x="60" y="212" text-anchor="middle">F0</text>
      </g>
      <g>
        <line x1="308" y1="190" x2="308" y2="195" stroke="#9CA3AF"/>
        <text x="308" y="212" text-anchor="middle">F5</text>
      </g>
      <g>
        <line x1="555" y1="190" x2="555" y2="195" stroke="#9CA3AF"/>
        <text x="555" y="212" text-anchor="middle">F10</text>
      </g>
      <g>
        <line x1="802" y1="190" x2="802" y2="195" stroke="#9CA3AF"/>
        <text x="802" y="212" text-anchor="middle">F15</text>
      </g>
      <g>
        <line x1="1050" y1="190" x2="1050" y2="195" stroke="#1F2937" stroke-width="1.5"/>
        <text x="1050" y="212" text-anchor="middle">F20</text>
      </g>
      <text x="1050" y="228" text-anchor="end" font-size="10" fill="#6B7280">时间轴 · Frame (60FPS)</text>
    </g>

    <!-- FOV 曲线: 缓入缓出 75->22
         y = 50 + (190-50) * (1 - ease)
         x = 60 + F*49.5
         使用贝塞尔: M 60 50 C 200 60, 260 170, 555 178 S 900 188, 1050 188
    -->
    <path d="M 60 50
             C 180 54, 230 160, 430 178
             C 600 186, 780 188, 1050 188"
          fill="none" stroke="url(#fovLine)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 数据点 -->
    <g>
      <circle cx="60" cy="50" r="5" fill="#FFFFFF" stroke="#4A7CC9" stroke-width="2.5"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">75°</text>

      <circle cx="308" cy="115" r="4" fill="#4A7CC9"/>
      <text x="308" y="108" text-anchor="middle" font-size="10" fill="#1E40AF">52°</text>

      <circle cx="555" cy="178" r="4" fill="#4A7CC9"/>
      <text x="555" y="170" text-anchor="middle" font-size="10" fill="#1E40AF">26°</text>

      <circle cx="1050" cy="188" r="5" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5"/>
      <text x="1050" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">22°</text>
    </g>

    <!-- 渐变填充 -->
    <path d="M 60 50
             C 180 54, 230 160, 430 178
             C 600 186, 780 188, 1050 188
             L 1050 190 L 60 190 Z"
          fill="#4A7CC9" opacity="0.08"/>
  </g>

  <!-- 中间瞄准镜淡入示意 4 个环 -->
  <g transform="translate(60, 400)">
    <rect width="1080" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1F2937">瞄准镜淡入示意 (圆圈表示镜环轮廓与透明度变化)</text>

    <!-- 4 个渐大环 F5 / F10 / F15 / F20 -->
    <g transform="translate(160, 70)">
      <!-- F5 淡灰小环 -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.35"/>
      <text x="0" y="48" text-anchor="middle" font-size="11" fill="#6B7280">F5  30%</text>
    </g>
    <g transform="translate(370, 70)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#4A7CC9" stroke-width="2" opacity="0.55"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#4A7CC9" stroke-width="1" opacity="0.4"/>
      <line x1="-42" y1="0" x2="-26" y2="0" stroke="#4A7CC9" stroke-width="1.5" opacity="0.6"/>
      <line x1="26" y1="0" x2="42" y2="0" stroke="#4A7CC9" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="-42" x2="0" y2="-26" stroke="#4A7CC9" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="26" x2="0" y2="42" stroke="#4A7CC9" stroke-width="1.5" opacity="0.6"/>
      <text x="0" y="58" text-anchor="middle" font-size="11" fill="#4A7CC9">F10  55%</text>
    </g>
    <g transform="translate(620, 70)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#4A7CC9" stroke-width="2.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#4A7CC9" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#4A7CC9" stroke-width="1" opacity="0.6"/>
      <line x1="-52" y1="0" x2="-30" y2="0" stroke="#4A7CC9" stroke-width="1.8" opacity="0.8"/>
      <line x1="30" y1="0" x2="52" y2="0" stroke="#4A7CC9" stroke-width="1.8" opacity="0.8"/>
      <line x1="0" y1="-52" x2="0" y2="-30" stroke="#4A7CC9" stroke-width="1.8" opacity="0.8"/>
      <line x1="0" y1="30" x2="0" y2="52" stroke="#4A7CC9" stroke-width="1.8" opacity="0.8"/>
      <line x1="-2" y1="-54" x2="-2" y2="54" stroke="#D4A853" stroke-width="1" opacity="0.7"/>
      <line x1="-54" y1="-2" x2="54" y2="-2" stroke="#D4A853" stroke-width="1" opacity="0.7"/>
      <text x="0" y="68" text-anchor="middle" font-size="11" fill="#4A7CC9" font-weight="700">F15  85%</text>
    </g>
    <g transform="translate(900, 70)">
      <!-- F20 满环瞄准镜 -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1F2937" stroke-width="6"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4A7CC9" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#4A7CC9" stroke-width="1.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#4A7CC9" stroke-width="1" opacity="0.7"/>
      <!-- 十字 -->
      <line x1="-62" y1="0" x2="-36" y2="0" stroke="#D4A853" stroke-width="2"/>
      <line x1="36" y1="0" x2="62" y2="0" stroke="#D4A853" stroke-width="2"/>
      <line x1="0" y1="-62" x2="0" y2="-36" stroke="#D4A853" stroke-width="2"/>
      <line x1="0" y1="36" x2="0" y2="62" stroke="#D4A853" stroke-width="2"/>
      <line x1="-1" y1="-48" x2="-1" y2="48" stroke="#1F2937" stroke-width="1.2"/>
      <line x1="-48" y1="-1" x2="48" y2="-1" stroke="#1F2937" stroke-width="1.2"/>
      <text x="0" y="80" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="700">F20  100%  ·  完成</text>
    </g>

    <!-- 箭头 -->
    <line x1="200" y1="70" x2="320" y2="70" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="420" y1="70" x2="560" y2="70" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="680" y1="70" x2="820" y2="70" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
  </g>

  <!-- 下方透明度曲线 -->
  <g transform="translate(60, 550)">
    <rect width="1080" height="170" rx="10" fill="#FFFBF2" stroke="#F3E8C7"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1F2937">下方曲线 · 瞄准镜透明度  0% → 100%</text>

    <!-- Y 轴 -->
    <g font-size="11" fill="#6B7280">
      <line x1="60" y1="140" x2="60" y2="50" stroke="#D1D5DB" stroke-width="1"/>
      <text x="56" y="54" text-anchor="end">100%</text>
      <line x1="56" y1="50" x2="60" y2="50" stroke="#9CA3AF"/>
      <text x="56" y="98" text-anchor="end">50%</text>
      <line x1="56" y1="95" x2="60" y2="95" stroke="#D1D5DB"/>
      <text x="56" y="142" text-anchor="end">0%</text>
      <line x1="56" y1="140" x2="60" y2="140" stroke="#9CA3AF"/>
    </g>

    <!-- X 轴 -->
    <g font-size="11" fill="#6B7280">
      <line x1="60" y1="140" x2="1050" y2="140" stroke="#D1D5DB" stroke-width="1" marker-end="url(#arr)"/>
      <line x1="60" y1="140" x2="60" y2="145" stroke="#1F2937" stroke-width="1.5"/>
      <text x="60" y="160" text-anchor="middle">F0</text>
      <line x1="308" y1="140" x2="308" y2="145" stroke="#9CA3AF"/>
      <text x="308" y="160" text-anchor="middle">F5</text>
      <line x1="555" y1="140" x2="555" y2="145" stroke="#9CA3AF"/>
      <text x="555" y="160" text-anchor="middle">F10</text>
      <line x1="802" y1="140" x2="802" y2="145" stroke="#9CA3AF"/>
      <text x="802" y="160" text-anchor="middle">F15</text>
      <line x1="1050" y1="140" x2="1050" y2="145" stroke="#1F2937" stroke-width="1.5"/>
      <text x="1050" y="160" text-anchor="middle">F20</text>
    </g>

    <!-- alpha 曲线: 缓入 0->100
         140 (0%) -> 50 (100%)
         ease-out
    -->
    <path d="M 60 140
             C 220 138, 260 70, 500 58
             C 700 52, 860 50, 1050 50"
          fill="none" stroke="url(#alphaLine)" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M 60 140
             C 220 138, 260 70, 500 58
             C 700 52, 860 50, 1050 50
             L 1050 140 L 60 140 Z"
          fill="#D4A853" opacity="0.12"/>

    <g>
      <circle cx="60" cy="140" r="5" fill="#FFFFFF" stroke="#D4A853" stroke-width="2.5"/>
      <text x="60" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">0%</text>

      <circle cx="555" cy="56" r="4" fill="#D4A853"/>
      <text x="555" y="48" text-anchor="middle" font-size="10" fill="#92400E">92%</text>

      <circle cx="1050" cy="50" r="5" fill="#FFFFFF" stroke="#92400E" stroke-width="2.5"/>
      <text x="1050" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">100%</text>
    </g>
  </g>
</svg>
