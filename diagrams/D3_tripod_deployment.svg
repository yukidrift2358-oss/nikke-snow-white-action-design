<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="50%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F1D79B"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </linearGradient>
    <marker id="arrR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D3 双枪三脚架展开部署 · Tripod Deployment</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">重型双管武器支架四阶段动画  ·  滑出 → 张开 → 触地 → 锁死  ·  总耗时 18F (300ms)</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ========== 左侧动作序列 4 帧 ========== -->
  <g>
    <rect x="50" y="115" width="610" height="620" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
    <text x="355" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">动作序列 · 四帧关键姿势</text>
    <text x="355" y="166" text-anchor="middle" font-size="12" fill="#6B7280">F1 / F6 / F12 / F18  ·  水平箭头表示动画流向</text>

    <!-- 帧卡片: 统一 130x130 -->
    <!-- F1 卡片 -->
    <g transform="translate(80, 200)">
      <rect width="130" height="420" rx="10" fill="#FFFFFF" stroke="#4A7CC9" stroke-width="1.5"/>
      <rect x="0" y="0" width="130" height="38" rx="10" fill="#4A7CC9"/>
      <text x="65" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">F1</text>
      <text x="65" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#4A7CC9">双枪背后滑出</text>
      <text x="65" y="406" text-anchor="middle" font-size="11" fill="#6B7280">阶段 1 · 待机</text>

      <!-- 简笔: 人形 + 双枪在背后 -->
      <g transform="translate(15, 58)">
        <circle cx="50" cy="20" r="14" fill="none" stroke="#1F2937" stroke-width="2"/>
        <line x1="50" y1="34" x2="50" y2="110" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双手在背后 -->
        <line x1="50" y1="50" x2="28" y2="78" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="50" x2="72" y2="78" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双枪 (背后斜放) -->
        <rect x="34" y="66" width="8" height="60" rx="2" fill="url(#metal)" transform="rotate(-20 38 96)"/>
        <rect x="58" y="66" width="8" height="60" rx="2" fill="url(#metal)" transform="rotate(20 62 96)"/>
        <!-- 双脚 -->
        <line x1="50" y1="110" x2="36" y2="160" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="110" x2="64" y2="160" stroke="#1F2937" stroke-width="2.5"/>
      </g>
    </g>

    <!-- 箭头 1 -->
    <line x1="222" y1="410" x2="252" y2="410" stroke="#6B7280" stroke-width="2" marker-end="url(#arrR)"/>

    <!-- F6 卡片 -->
    <g transform="translate(260, 200)">
      <rect width="130" height="420" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="0" y="0" width="130" height="38" rx="10" fill="#60A5FA"/>
      <text x="65" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">F6</text>
      <text x="65" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">支架张开</text>
      <text x="65" y="406" text-anchor="middle" font-size="11" fill="#6B7280">阶段 2 · 展开</text>

      <g transform="translate(15, 58)">
        <circle cx="50" cy="20" r="14" fill="none" stroke="#1F2937" stroke-width="2"/>
        <line x1="50" y1="34" x2="50" y2="110" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双手向前端出 -->
        <line x1="50" y1="50" x2="30" y2="65" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="50" x2="80" y2="65" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双枪在前 -->
        <rect x="20" y="55" width="8" height="50" rx="2" fill="url(#metal)"/>
        <rect x="72" y="55" width="8" height="50" rx="2" fill="url(#metal)"/>
        <!-- 支架刚张开 (倒V) -->
        <line x1="40" y1="105" x2="20" y2="150" stroke="#D4A853" stroke-width="3"/>
        <line x1="60" y1="105" x2="80" y2="150" stroke="#D4A853" stroke-width="3"/>
        <circle cx="50" cy="105" r="3" fill="#D4A853"/>
        <!-- 双脚 -->
        <line x1="50" y1="110" x2="36" y2="160" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="110" x2="64" y2="160" stroke="#1F2937" stroke-width="2.5"/>
      </g>
    </g>

    <!-- 箭头 2 -->
    <line x1="402" y1="410" x2="432" y2="410" stroke="#6B7280" stroke-width="2" marker-end="url(#arrR)"/>

    <!-- F12 卡片 -->
    <g transform="translate(440, 200)">
      <rect width="130" height="420" rx="10" fill="#FFFFFF" stroke="#D4A853" stroke-width="1.5"/>
      <rect x="0" y="0" width="130" height="38" rx="10" fill="url(#goldBar)"/>
      <text x="65" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">F12</text>
      <text x="65" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">支架触地</text>
      <text x="65" y="406" text-anchor="middle" font-size="11" fill="#6B7280">阶段 3 · 落地</text>

      <g transform="translate(15, 58)">
        <circle cx="50" cy="20" r="14" fill="none" stroke="#1F2937" stroke-width="2"/>
        <line x1="50" y1="34" x2="50" y2="110" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双手向前下压 -->
        <line x1="50" y1="50" x2="30" y2="72" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="50" x2="80" y2="72" stroke="#1F2937" stroke-width="2.5"/>
        <!-- 双枪 -->
        <rect x="22" y="62" width="8" height="55" rx="2" fill="url(#metal)"/>
        <rect x="70" y="62" width="8" height="55" rx="2" fill="url(#metal)"/>
        <!-- 支架张开触地 (32度) -->
        <line x1="40" y1="115" x2="14" y2="160" stroke="#D4A853" stroke-width="3.2"/>
        <line x1="60" y1="115" x2="86" y2="160" stroke="#D4A853" stroke-width="3.2"/>
        <circle cx="50" cy="115" r="3.5" fill="#D4A853"/>
        <!-- 接地圆点 -->
        <circle cx="14" cy="160" r="4" fill="#DC2626"/>
        <circle cx="86" cy="160" r="4" fill="#DC2626"/>
        <!-- 地面 -->
        <line x1="2" y1="165" x2="98" y2="165" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 2"/>
        <!-- 双脚 -->
        <line x1="50" y1="110" x2="36" y2="160" stroke="#1F2937" stroke-width="2.5"/>
        <line x1="50" y1="110" x2="64" y2="160" stroke="#1F2937" stroke-width="2.5"/>
      </g>
    </g>

    <!-- 第二排 F18 居中放大 -->
    <g transform="translate(260, 660)" opacity="0">
    </g>
    <!-- F18 单独在第二行大卡片 -->
  </g>

  <!-- F18 大卡片 -->
  <g transform="translate(200, 360)">
    <rect x="0" y="320" width="310" height="250" rx="12" fill="#FFF7E6" stroke="#DC2626" stroke-width="2"/>
    <rect x="0" y="320" width="310" height="44" rx="12" fill="#DC2626"/>
    <text x="155" y="350" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">F18  ·  支架锁死 · 部署完成</text>

    <g transform="translate(30, 380)">
      <!-- 锁死示意: 双枪稳固 + 支架锁定扣 -->
      <!-- 双枪 -->
      <rect x="80" y="10" width="14" height="80" rx="3" fill="url(#metal)"/>
      <rect x="160" y="10" width="14" height="80" rx="3" fill="url(#metal)"/>
      <!-- 横梁 -->
      <rect x="72" y="70" width="110" height="10" rx="2" fill="#4B5563"/>
      <!-- 锁扣 -->
      <rect x="120" y="82" width="14" height="14" rx="2" fill="#DC2626"/>
      <text x="127" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">LOCK</text>
      <!-- 支架 (稳固三角形) -->
      <line x1="96" y1="92" x2="40" y2="200" stroke="#D4A853" stroke-width="4"/>
      <line x1="158" y1="92" x2="214" y2="200" stroke="#D4A853" stroke-width="4"/>
      <line x1="40" y1="200" x2="214" y2="200" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- 接地锁 -->
      <rect x="30" y="195" width="22" height="10" rx="2" fill="#1F2937"/>
      <rect x="202" y="195" width="22" height="10" rx="2" fill="#1F2937"/>
      <!-- 绿色完成标志 -->
      <circle cx="127" cy="160" r="24" fill="#16A34A" opacity="0.12"/>
      <path d="M 115 160 L 123 168 L 139 152" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round"/>
      <text x="127" y="196" text-anchor="middle" font-size="11" fill="#16A34A" font-weight="700">部署就绪 · Ready</text>
    </g>
  </g>

  <!-- ========== 右侧参数表格 ========== -->
  <g transform="translate(700, 115)">
    <rect width="450" height="620" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="52" rx="12" fill="#4A7CC9"/>
    <text x="225" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">支架规格参数表</text>

    <!-- 表头行 -->
    <g transform="translate(0, 76)" font-size="13">
      <rect x="20" y="0" width="410" height="36" rx="6" fill="#F3F4F6"/>
      <text x="40" y="24" font-weight="700" fill="#1F2937">参数项</text>
      <text x="240" y="24" font-weight="700" fill="#1F2937">数值</text>
      <text x="370" y="24" font-weight="700" fill="#1F2937">备注</text>
    </g>

    <!-- 数据行 -->
    <g transform="translate(0, 112)" font-size="13">
      <!-- 行 1 展开时间 -->
      <g transform="translate(0,0)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="40" y="32" fill="#1F2937">展开时间</text>
        <text x="240" y="32" font-weight="700" fill="#1E40AF">18F = 300ms</text>
        <text x="370" y="32" fill="#6B7280">@60FPS</text>
      </g>
      <!-- 行 2 支架材料 -->
      <g transform="translate(0,60)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="40" y="32" fill="#1F2937">支架材料</text>
        <text x="240" y="32" font-weight="700" fill="#1F2937">铝合金 6061-T6</text>
        <text x="370" y="32" fill="#6B7280">轻量</text>
      </g>
      <!-- 行 3 接地角度 -->
      <g transform="translate(0,120)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#FFF7E6" stroke="#FCD34D"/>
        <text x="40" y="32" fill="#1F2937">接地角度</text>
        <text x="240" y="32" font-weight="700" fill="#92400E">32°</text>
        <text x="370" y="32" fill="#6B7280">稳定</text>
        <!-- 小示意 -->
        <g transform="translate(290, 14)">
          <line x1="0" y1="24" x2="60" y2="24" stroke="#92400E" stroke-width="1.2"/>
          <line x1="30" y1="24" x2="5" y2="4" stroke="#92400E" stroke-width="1.2"/>
          <path d="M 24 24 A 12 12 0 0 0 16 14" fill="none" stroke="#92400E" stroke-width="1"/>
          <text x="16" y="20" font-size="9" fill="#92400E" font-weight="700">32°</text>
        </g>
      </g>
      <!-- 行 4 稳定性 -->
      <g transform="translate(0,180)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
        <text x="40" y="32" fill="#1F2937">展开后稳定性</text>
        <text x="240" y="32" font-weight="700" fill="#15803D">+40%</text>
        <!-- 进度条 -->
        <rect x="300" y="22" width="110" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="300" y="22" width="70" height="12" rx="6" fill="#16A34A"/>
      </g>
      <!-- 行 5 收回时间 -->
      <g transform="translate(0,240)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#FEE2E2" stroke="#FCA5A5"/>
        <text x="40" y="32" fill="#1F2937">收回时间</text>
        <text x="240" y="32" font-weight="700" fill="#991B1B">12F = 200ms</text>
        <text x="370" y="32" fill="#6B7280">快速</text>
      </g>
      <!-- 行 6 重量 -->
      <g transform="translate(0,300)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="40" y="32" fill="#1F2937">组件自重</text>
        <text x="240" y="32" font-weight="700" fill="#1F2937">1.8 kg</text>
        <text x="370" y="32" fill="#6B7280">便携</text>
      </g>
      <!-- 行 7 耐久 -->
      <g transform="translate(0,360)">
        <rect x="20" y="0" width="410" height="52" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="40" y="32" fill="#1F2937">展开/收回 寿命</text>
        <text x="240" y="32" font-weight="700" fill="#1F2937">≥ 10,000 次</text>
        <text x="370" y="32" fill="#6B7280">耐久</text>
      </g>
    </g>

    <!-- 底部提示 -->
    <g transform="translate(20, 530)">
      <rect width="410" height="70" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="20" y="28" font-size="13" font-weight="700" fill="#92400E">关键帧事件</text>
      <g font-size="11" fill="#78350F">
        <text x="20" y="48">F1: 部署指令进入  ·  F6: 支架张开事件 OnTripodOpen</text>
        <text x="20" y="64">F12: 支架触地 OnTripodGround  ·  F18: 锁死 OnTripodReady (可开火)</text>
      </g>
    </g>
  </g>
</svg>
