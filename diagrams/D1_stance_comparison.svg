<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6B7280"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#DC2626" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D1 射击姿态对比 · Weaver 立姿 vs Bladed 开立姿</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">FPS 战术射击核心姿态力学分析 · 双脚间距 / 重心分布 / 瞄准基线对齐</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 地面参考线 -->
  <line x1="60" y1="620" x2="1140" y2="620" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="625" font-size="12" fill="#6B7280">地面</text>

  <!-- ========== 左侧 Weaver 立姿 ========== -->
  <g transform="translate(0,0)">
    <rect x="80" y="120" width="460" height="520" rx="12" fill="#F5F9FF" stroke="#4A7CC9" stroke-width="1.2" opacity="0.8"/>
    <text x="310" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#4A7CC9">Weaver 立姿</text>
    <text x="310" y="172" text-anchor="middle" font-size="12" fill="#6B7280">双脚 30cm · 重心中间 · 双手前平端</text>

    <!-- 火柴人: 头 -->
    <circle cx="250" cy="250" r="22" fill="none" stroke="#4A7CC9" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="260" cy="248" r="2.5" fill="#4A7CC9"/>
    <!-- 躯干 -->
    <line x1="250" y1="272" x2="250" y2="400" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 重心虚线 -->
    <line x1="250" y1="400" x2="250" y2="620" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="258" y="520" font-size="12" fill="#DC2626" font-weight="700">重心 COG</text>

    <!-- 双手端枪朝前水平 -->
    <line x1="250" y1="310" x2="380" y2="308" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 枪身 -->
    <rect x="380" y="300" width="90" height="14" rx="3" fill="#1F2937"/>
    <rect x="455" y="296" width="18" height="8" fill="#6B7280"/>
    <circle cx="395" cy="307" r="4" fill="#D4A853"/>
    <!-- 前手 -->
    <circle cx="380" cy="308" r="6" fill="#D4A853"/>
    <!-- 后手 -->
    <circle cx="310" cy="309" r="6" fill="#4A7CC9"/>

    <!-- 支撑手 -->
    <line x1="250" y1="310" x2="310" y2="309" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 双脚 30cm -->
    <!-- 左腿 -->
    <line x1="250" y1="400" x2="225" y2="540" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="225" y1="540" x2="215" y2="620" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 脚 -->
    <ellipse cx="210" cy="622" rx="22" ry="5" fill="#4A7CC9" opacity="0.5"/>
    <text x="210" y="648" text-anchor="middle" font-size="11" fill="#6B7280">L</text>

    <!-- 右腿 -->
    <line x1="250" y1="400" x2="278" y2="540" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="278" y1="540" x2="288" y2="620" stroke="#4A7CC9" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="294" cy="622" rx="22" ry="5" fill="#4A7CC9" opacity="0.5"/>
    <text x="294" y="648" text-anchor="middle" font-size="11" fill="#6B7280">R</text>

    <!-- 30cm 标注 -->
    <line x1="210" y1="670" x2="294" y2="670" stroke="#D4A853" stroke-width="1.6" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="252" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#D4A853">30 cm</text>

    <!-- 重心分布 50/50 -->
    <rect x="140" y="695" width="340" height="26" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="140" y="695" width="170" height="26" rx="5" fill="url(#hatch)" opacity="0.6"/>
    <text x="225" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">50%</text>
    <text x="395" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">50%</text>
    <text x="310" y="748" text-anchor="middle" font-size="11" fill="#6B7280">左脚承重 : 右脚承重  ·  均匀分布</text>
  </g>

  <!-- ========== 右侧 Bladed 开立姿 ========== -->
  <g transform="translate(0,0)">
    <rect x="660" y="120" width="460" height="520" rx="12" fill="#FFFBF2" stroke="#D4A853" stroke-width="1.2" opacity="0.8"/>
    <text x="890" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#D4A853">Bladed 开立姿</text>
    <text x="890" y="172" text-anchor="middle" font-size="12" fill="#6B7280">双脚 60cm · 前 60% / 后 40% · 枪托抵肩三点一线</text>

    <!-- 火柴人: 头 (侧脸) -->
    <circle cx="870" cy="250" r="22" fill="none" stroke="#D4A853" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="882" cy="248" r="2.5" fill="#D4A853"/>
    <!-- 躯干 (略微侧身) -->
    <line x1="870" y1="272" x2="855" y2="400" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 枪托抵肩: 从肩(855,290) 前伸 -->
    <!-- 枪身 -->
    <rect x="850" y="282" width="110" height="14" rx="3" fill="#1F2937"/>
    <rect x="945" y="278" width="20" height="8" fill="#6B7280"/>
    <rect x="840" y="286" width="14" height="8" rx="2" fill="#8B4513"/>
    <!-- 枪托抵肩标注 -->
    <text x="820" y="275" font-size="11" fill="#8B4513" font-weight="700">枪托抵肩</text>
    <line x1="838" y1="280" x2="846" y2="288" stroke="#8B4513" stroke-width="1.2"/>

    <!-- 双手 -->
    <!-- 后手 (扳机手) -->
    <line x1="855" y1="300" x2="880" y2="292" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="880" cy="292" r="6" fill="#4A7CC9"/>
    <!-- 前手 (托枪) -->
    <line x1="855" y1="320" x2="920" y2="304" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="920" cy="304" r="6" fill="#D4A853"/>

    <!-- 视线-照门-准星 三点连线 -->
    <!-- 准星 -->
    <circle cx="965" cy="284" r="3" fill="#DC2626"/>
    <text x="965" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">准星</text>
    <!-- 照门 -->
    <circle cx="895" cy="286" r="3" fill="#DC2626"/>
    <text x="895" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">照门</text>
    <!-- 眼睛 -->
    <circle cx="882" cy="248" r="3" fill="#DC2626"/>
    <text x="868" y="236" font-size="10" font-weight="700" fill="#DC2626">视线</text>
    <!-- 连线 -->
    <line x1="882" y1="248" x2="895" y2="286" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3 2"/>
    <line x1="895" y1="286" x2="965" y2="284" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3 2"/>
    <text x="925" y="310" font-size="11" font-style="italic" fill="#DC2626">瞄准基线 · 三点一线</text>

    <!-- 重心虚线 -->
    <line x1="860" y1="400" x2="845" y2="620" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="820" y="530" font-size="12" fill="#DC2626" font-weight="700">重心 COG 偏前</text>

    <!-- 双脚 60cm -->
    <!-- 左腿 (前脚) -->
    <line x1="855" y1="400" x2="830" y2="530" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="830" y1="530" x2="820" y2="620" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="815" cy="622" rx="24" ry="5" fill="#D4A853" opacity="0.6"/>
    <text x="815" y="648" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="700">前足 F</text>

    <!-- 右腿 (后脚) -->
    <line x1="855" y1="400" x2="910" y2="530" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="910" y1="530" x2="930" y2="620" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="936" cy="622" rx="24" ry="5" fill="#4A7CC9" opacity="0.5"/>
    <text x="936" y="648" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="700">后足 B</text>

    <!-- 60cm 标注 -->
    <line x1="815" y1="670" x2="936" y2="670" stroke="#D4A853" stroke-width="1.6" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="875" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#D4A853">60 cm</text>

    <!-- 重心分布 60/40 -->
    <rect x="720" y="695" width="340" height="26" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="720" y="695" width="204" height="26" rx="5" fill="url(#hatch)" opacity="0.7"/>
    <line x1="924" y1="695" x2="924" y2="721" stroke="#6B7280" stroke-width="1"/>
    <text x="822" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">60% 前足</text>
    <text x="990" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">40% 后足</text>
    <text x="890" y="748" text-anchor="middle" font-size="11" fill="#6B7280">前倾受力 · 后坐阻力更稳定</text>
  </g>

  <!-- 分隔线 -->
  <line x1="600" y1="120" x2="600" y2="640" stroke="#E5E7EB" stroke-width="1"/>
</svg>
