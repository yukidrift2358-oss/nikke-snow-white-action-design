<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="chargeGrad" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="60%" stop-color="#7FA9E8"/>
      <stop offset="85%" stop-color="#E8C878"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="1"/>
      <stop offset="85%" stop-color="#E2E8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="780" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D5 第一人称瞄准镜 UI 蓝图 · Scope UI Blueprint</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">8x 倍率战术瞄准镜 HUD 设计  ·  十字 Mil 分化  ·  蓄力 / 弹药 / 倍率 / 距离 / 风向 完整信息层</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 外框卡片 -->
  <rect x="110" y="120" width="980" height="640" rx="16" fill="#0B1220" stroke="#1F2937" stroke-width="1"/>

  <!-- 瞄准镜圆形主体 (居中)  中心 600, 440  半径 260 -->
  <g>
    <!-- 外黑边 / 镜身阴影 -->
    <circle cx="600" cy="440" r="280" fill="#000000"/>
    <!-- 蓝色外框 -->
    <circle cx="600" cy="440" r="268" fill="none" stroke="#4A7CC9" stroke-width="6"/>
    <circle cx="600" cy="440" r="262" fill="none" stroke="#7FA9E8" stroke-width="1.5"/>
    <!-- 镜片内背景 (战场视野) -->
    <circle cx="600" cy="440" r="258" fill="url(#lens)"/>
    <!-- 战场模拟: 远山 -->
    <path d="M 345 460 Q 430 380 520 430 T 720 420 T 855 470 L 855 580 L 345 580 Z"
          fill="#4A7CC9" opacity="0.14"/>
    <path d="M 345 520 Q 470 470 600 500 T 855 510 L 855 580 L 345 580 Z"
          fill="#4A7CC9" opacity="0.1"/>
    <!-- 地面 -->
    <rect x="345" y="560" width="510" height="40" fill="#D4A853" opacity="0.08"/>

    <!-- ============ 十字分化 Mil 刻度 ============ -->
    <!-- 主水平线 -->
    <line x1="345" y1="440" x2="855" y2="440" stroke="#1F2937" stroke-width="1.2" opacity="0.8"/>
    <!-- 主垂直线 -->
    <line x1="600" y1="185" x2="600" y2="695" stroke="#1F2937" stroke-width="1.2" opacity="0.8"/>

    <!-- 中心红点 -->
    <circle cx="600" cy="440" r="2.5" fill="#DC2626"/>
    <circle cx="600" cy="440" r="6" fill="#DC2626" opacity="0.2"/>

    <!-- 横向 Mil 刻度 (左右)
         每 1 Mil = 22px.  2/4/6/8/10 对应 44/88/132/176/220
    -->
    <g stroke="#1F2937" stroke-width="1.6" font-size="11" fill="#1F2937" font-family="'Consolas','Courier New', monospace">
      <!-- 右刻度 -->
      <line x1="644" y1="440" x2="644" y2="452"/>
      <text x="644" y="468" text-anchor="middle">2</text>
      <line x1="688" y1="440" x2="688" y2="456"/>
      <text x="688" y="472" text-anchor="middle">4</text>
      <line x1="732" y1="440" x2="732" y2="452"/>
      <text x="732" y="468" text-anchor="middle">6</text>
      <line x1="776" y1="440" x2="776" y2="456"/>
      <text x="776" y="472" text-anchor="middle">8</text>
      <line x1="820" y1="440" x2="820" y2="452"/>
      <text x="820" y="468" text-anchor="middle">10</text>
      <text x="840" y="434" text-anchor="end" font-size="9" fill="#4A7CC9">Mil →</text>

      <!-- 左刻度 -->
      <line x1="556" y1="440" x2="556" y2="452"/>
      <text x="556" y="468" text-anchor="middle">2</text>
      <line x1="512" y1="440" x2="512" y2="456"/>
      <text x="512" y="472" text-anchor="middle">4</text>
      <line x1="468" y1="440" x2="468" y2="452"/>
      <text x="468" y="468" text-anchor="middle">6</text>
      <line x1="424" y1="440" x2="424" y2="456"/>
      <text x="424" y="472" text-anchor="middle">8</text>
      <line x1="380" y1="440" x2="380" y2="452"/>
      <text x="380" y="468" text-anchor="middle">10</text>
    </g>

    <!-- 纵向 Mil 刻度 (上下) -->
    <g stroke="#1F2937" stroke-width="1.6" font-size="11" fill="#1F2937" font-family="'Consolas','Courier New', monospace">
      <!-- 上 -->
      <line x1="600" y1="396" x2="612" y2="396"/>
      <text x="620" y="400">2</text>
      <line x1="600" y1="352" x2="612" y2="352"/>
      <text x="620" y="356">4</text>
      <line x1="600" y1="308" x2="612" y2="308"/>
      <text x="620" y="312">6</text>
      <line x1="600" y1="264" x2="612" y2="264"/>
      <text x="620" y="268">8</text>
      <line x1="600" y1="220" x2="612" y2="220"/>
      <text x="620" y="224">10</text>
      <text x="614" y="200" font-size="9" fill="#4A7CC9">↑ Mil</text>

      <!-- 下 -->
      <line x1="600" y1="484" x2="612" y2="484"/>
      <text x="620" y="488">2</text>
      <line x1="600" y1="528" x2="612" y2="528"/>
      <text x="620" y="532">4</text>
      <line x1="600" y1="572" x2="612" y2="572"/>
      <text x="620" y="576">6</text>
      <line x1="600" y1="616" x2="612" y2="616"/>
      <text x="620" y="620">8</text>
      <line x1="600" y1="660" x2="612" y2="660"/>
      <text x="620" y="664">10</text>
    </g>

    <!-- 小刻度半 Mil -->
    <g stroke="#1F2937" stroke-width="0.8" opacity="0.6">
      <!-- 右 -->
      <line x1="622" y1="440" x2="622" y2="446"/>
      <line x1="666" y1="440" x2="666" y2="446"/>
      <line x1="710" y1="440" x2="710" y2="446"/>
      <line x1="754" y1="440" x2="754" y2="446"/>
      <line x1="798" y1="440" x2="798" y2="446"/>
      <!-- 左 -->
      <line x1="578" y1="440" x2="578" y2="446"/>
      <line x1="534" y1="440" x2="534" y2="446"/>
      <line x1="490" y1="440" x2="490" y2="446"/>
      <line x1="446" y1="440" x2="446" y2="446"/>
      <line x1="402" y1="440" x2="402" y2="446"/>
      <!-- 上 -->
      <line x1="600" y1="418" x2="606" y2="418"/>
      <line x1="600" y1="374" x2="606" y2="374"/>
      <line x1="600" y1="330" x2="606" y2="330"/>
      <line x1="600" y1="286" x2="606" y2="286"/>
      <line x1="600" y1="242" x2="606" y2="242"/>
      <!-- 下 -->
      <line x1="600" y1="462" x2="606" y2="462"/>
      <line x1="600" y1="506" x2="606" y2="506"/>
      <line x1="600" y1="550" x2="606" y2="550"/>
      <line x1="600" y1="594" x2="606" y2="594"/>
      <line x1="600" y1="638" x2="606" y2="638"/>
    </g>

    <!-- 暗角 -->
    <circle cx="600" cy="440" r="258" fill="url(#vignette)"/>

    <!-- 蓝色镜圈高光 -->
    <circle cx="600" cy="440" r="258" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- ============ 顶部: 目标距离 + 风向指示 ============ -->
  <g transform="translate(450, 125)">
    <rect width="300" height="38" rx="8" fill="#0F172A" stroke="#4A7CC9" stroke-width="1.5" opacity="0.92"/>
    <!-- 目标距离 -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" font-size="10" fill="#93C5FD" letter-spacing="1">TARGET</text>
      <text x="56" y="0" font-size="16" font-weight="700" fill="#FFFFFF" font-family="'Consolas','Courier New', monospace">247.3 m</text>
    </g>
    <!-- 分隔 -->
    <line x1="180" y1="8" x2="180" y2="30" stroke="#334155"/>
    <!-- 风向指示 -->
    <g transform="translate(210, 19)">
      <text x="0" y="0" font-size="10" fill="#FCD34D" letter-spacing="1">WIND</text>
      <!-- 风向箭头 -->
      <g transform="translate(40, -2)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#D4A853" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="7" y2="-3" stroke="#D4A853" stroke-width="1.6" stroke-linecap="round"/>
        <polygon points="10,-5 6,-1 7,-7" fill="#D4A853"/>
      </g>
      <text x="62" y="0" font-size="14" font-weight="700" fill="#FCD34D" font-family="'Consolas','Courier New', monospace">→3.2</text>
    </g>
  </g>

  <!-- ============ 右侧蓄力条 ============ -->
  <g transform="translate(900, 240)">
    <!-- 外框 -->
    <rect x="0" y="0" width="44" height="360" rx="8" fill="#0F172A" stroke="#4A7CC9" stroke-width="1.5"/>
    <text x="22" y="-10" text-anchor="middle" font-size="10" fill="#93C5FD" letter-spacing="1.5">CHARGE</text>

    <!-- 刻度 0~100% -->
    <g font-size="8" fill="#64748B" font-family="'Consolas', monospace">
      <text x="50" y="10" text-anchor="start">100</text>
      <line x1="40" y1="8" x2="44" y2="8" stroke="#64748B"/>
      <text x="50" y="100" text-anchor="start">75</text>
      <line x1="40" y1="98" x2="44" y2="98" stroke="#64748B"/>
      <text x="50" y="190" text-anchor="start">50</text>
      <line x1="40" y1="188" x2="44" y2="188" stroke="#64748B"/>
      <text x="50" y="280" text-anchor="start">25</text>
      <line x1="40" y1="278" x2="44" y2="278" stroke="#64748B"/>
      <text x="50" y="358" text-anchor="start">0</text>
      <line x1="40" y1="356" x2="44" y2="356" stroke="#64748B"/>
    </g>

    <!-- 填充 92% (满蓄力 接近朝圣者标识)  360*0.92=331 -->
    <rect x="8" y="29" width="28" height="323" rx="4" fill="url(#chargeGrad)"/>
    <!-- 高光 -->
    <rect x="11" y="32" width="6" height="315" rx="3" fill="#FFFFFF" opacity="0.2"/>
    <!-- 百分比 -->
    <text x="22" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#D4A853" font-family="'Consolas', monospace">92%</text>

    <!-- 满蓄力 朝圣者标识 -->
    <g transform="translate(22, 16)">
      <circle cx="0" cy="0" r="11" fill="#FFFFFF" stroke="#D4A853" stroke-width="2"/>
      <!-- 朝圣者帽 -->
      <path d="M -6 -2 Q 0 -10 6 -2 L 5 0 L -5 0 Z" fill="#D4A853"/>
      <rect x="-7" y="0" width="14" height="2" fill="#92400E"/>
      <!-- 脸 -->
      <circle cx="-2" cy="3" r="0.8" fill="#1F2937"/>
      <circle cx="2" cy="3" r="0.8" fill="#1F2937"/>
      <path d="M -2 6 Q 0 8 2 6" fill="none" stroke="#1F2937" stroke-width="0.8"/>
    </g>
    <text x="22" y="-24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#D4A853">朝圣者</text>
    <text x="22" y="378" text-anchor="middle" font-size="8.5" fill="#93C5FD">满蓄力开火</text>
  </g>

  <!-- ============ 左下 弹药数 ============ -->
  <g transform="translate(180, 640)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#0F172A" stroke="#4A7CC9" stroke-width="1.5" opacity="0.92"/>
    <text x="16" y="22" font-size="10" fill="#93C5FD" letter-spacing="1.5">AMMO</text>

    <!-- 弹匣内数字 -->
    <g transform="translate(16, 40)">
      <text x="0" y="30" font-size="40" font-weight="800" fill="#FFFFFF" font-family="'Consolas','Courier New', monospace">24</text>
      <text x="90" y="30" font-size="20" font-weight="600" fill="#64748B" font-family="'Consolas','Courier New', monospace">/ 120</text>
    </g>

    <!-- 弹药小条 -->
    <g transform="translate(16, 76)">
      <g>
        <rect x="0" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="8" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="16" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="24" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="32" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="40" y="0" width="6" height="8" fill="#4A7CC9"/>
        <rect x="48" y="0" width="6" height="8" fill="#D4A853"/>
        <rect x="56" y="0" width="6" height="8" fill="#D4A853"/>
        <rect x="64" y="0" width="6" height="8" fill="#334155"/>
        <rect x="72" y="0" width="6" height="8" fill="#334155"/>
        <rect x="80" y="0" width="6" height="8" fill="#334155"/>
        <rect x="88" y="0" width="6" height="8" fill="#334155"/>
      </g>
      <text x="110" y="8" font-size="9" fill="#64748B">+2 金弹</text>
    </g>
  </g>

  <!-- ============ 右下 倍率 8x ============ -->
  <g transform="translate(820, 640)">
    <rect x="0" y="0" width="160" height="90" rx="10" fill="#0F172A" stroke="#D4A853" stroke-width="1.8" opacity="0.92"/>
    <text x="16" y="22" font-size="10" fill="#FCD34D" letter-spacing="1.5">ZOOM · MAG</text>

    <!-- 大 8x -->
    <text x="80" y="72" text-anchor="middle" font-size="48" font-weight="900" fill="#FFFFFF" font-family="'Impact','Arial Black',sans-serif" letter-spacing="2">
      8<tspan font-size="32" fill="#D4A853" dy="-8">x</tspan>
    </text>

    <!-- 小倍率切换提示 -->
    <g font-size="8.5" fill="#64748B" text-anchor="middle">
      <rect x="12" y="78" width="22" height="10" rx="2" fill="#1E293B" stroke="#334155"/>
      <text x="23" y="86">2x</text>
      <rect x="40" y="78" width="22" height="10" rx="2" fill="#1E293B" stroke="#334155"/>
      <text x="51" y="86">4x</text>
      <rect x="68" y="78" width="22" height="10" rx="2" fill="#D4A853" stroke="#B8862E"/>
      <text x="79" y="86" fill="#1F2937" font-weight="700">8x</text>
      <rect x="96" y="78" width="22" height="10" rx="2" fill="#1E293B" stroke="#334155"/>
      <text x="107" y="86">12x</text>
      <rect x="124" y="78" width="22" height="10" rx="2" fill="#1E293B" stroke="#334155"/>
      <text x="135" y="86">16x</text>
    </g>
  </g>

  <!-- 说明标签 (底部蓝色条) -->
  <g transform="translate(130, 740)">
    <text x="0" y="0" font-size="11" fill="#94A3B8">① 十字 Mil 分化 (±10 Mil 刻度, 0.5 Mil 小刻度)</text>
    <text x="320" y="0" font-size="11" fill="#94A3B8">② 蓄力条 蓝→金 渐变  满蓄力朝圣者被动</text>
    <text x="640" y="0" font-size="11" fill="#94A3B8">③ 弹药 24/120 + 2 金弹  ·  ④ 8x 倍率 可切换 2/4/8/12/16</text>
    <text x="950" y="0" font-size="11" fill="#94A3B8">⑤ 顶部 目标 247.3m · 风向 →3.2 m/s</text>
  </g>
</svg>
