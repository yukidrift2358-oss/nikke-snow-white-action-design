<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="seg1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="seg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="seg3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="seg4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1F2937"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1E40AF"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D6 终极技能摄像机分镜时间轴 · Ultimate Camera Timeline</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">处决 / 大招演出 4 段式分镜  ·  0~252F 全流程  ·  机位切换 × FOV 连续过渡  ·  @60FPS = 4.2 秒</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 图例 -->
  <g transform="translate(60, 112)" font-size="12" fill="#1F2937">
    <rect x="0" y="0" width="24" height="16" rx="3" fill="url(#seg1)" stroke="#93C5FD"/>
    <text x="32" y="13">① F1-F70  正脸抬枪</text>
    <rect x="210" y="0" width="24" height="16" rx="3" fill="url(#seg2)" stroke="#60A5FA"/>
    <text x="242" y="13">② F71-F140  枪身旋转过渡</text>
    <rect x="450" y="0" width="24" height="16" rx="3" fill="url(#seg3)" stroke="#1D4ED8"/>
    <text x="482" y="13">③ F141-F195  瞄准镜第一人称</text>
    <rect x="720" y="0" width="24" height="16" rx="3" fill="url(#seg4)" stroke="#9CA3AF"/>
    <text x="752" y="13">④ F196-F252  收势回放</text>
    <text x="950" y="13" fill="#6B7280">总帧数 252F · 演出时长 4.2s</text>
  </g>

  <!-- 时间轴: x = 80 + F*4.127 (252F -> 80..1120)
       每 F = (1120-80)/252 ≈ 4.12698 px
  -->
  <!-- 主体分镜色块带  y 140~500 -->
  <g>
    <!-- 段1 F1-F70: 80 + 1*4.127 ~ 80 + 70*4.127 = 84.13 ~ 368.89 -->
    <rect x="84" y="160" width="285" height="320" rx="8" fill="url(#seg1)" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- 段2 F71-F140: 80+71*4.127=373.02 ~ 80+140*4.127=657.78 -->
    <rect x="373" y="160" width="285" height="320" rx="8" fill="url(#seg2)" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- 段3 F141-F195: 80+141*4.127=661.91 ~ 80+195*4.127=884.77 -->
    <rect x="662" y="160" width="223" height="320" rx="8" fill="url(#seg3)" stroke="#1E40AF" stroke-width="1.5"/>
    <!-- 段4 F196-F252: 80+196*4.127=888.89 ~ 80+252*4.127=1120 -->
    <rect x="889" y="160" width="231" height="320" rx="8" fill="url(#seg4)" stroke="#6B7280" stroke-width="1.5"/>

    <!-- 段标题 -->
    <text x="226" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">① 正脸抬枪</text>
    <text x="515" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">② 枪身旋转过渡</text>
    <text x="773" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">③ 瞄准镜第一人称</text>
    <text x="1004" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">④ 收势回放</text>

    <!-- 段帧范围 -->
    <text x="226" y="208" text-anchor="middle" font-size="11" fill="#1E40AF" font-family="'Consolas',monospace">F1 ~ F70   (70F / 1.17s)</text>
    <text x="515" y="208" text-anchor="middle" font-size="11" fill="#1E40AF" font-family="'Consolas',monospace">F71 ~ F140   (70F / 1.17s)</text>
    <text x="773" y="208" text-anchor="middle" font-size="11" fill="#BFDBFE" font-family="'Consolas',monospace">F141 ~ F195   (55F / 0.92s)</text>
    <text x="1004" y="208" text-anchor="middle" font-size="11" fill="#374151" font-family="'Consolas',monospace">F196 ~ F252   (57F / 0.95s)</text>

    <!-- 段内小示意画面: 简笔 -->

    <!-- 段1 正脸抬枪: 小人从下向上抬手 -->
    <g transform="translate(186, 230)">
      <rect width="80" height="120" rx="6" fill="#FFFFFF" stroke="#60A5FA" opacity="0.85"/>
      <!-- 小人 -->
      <circle cx="40" cy="30" r="10" fill="none" stroke="#1E3A8A" stroke-width="1.8"/>
      <line x1="40" y1="40" x2="40" y2="80" stroke="#1E3A8A" stroke-width="2"/>
      <!-- 手从下向上抬 (箭头) -->
      <line x1="40" y1="52" x2="20" y2="72" stroke="#1E3A8A" stroke-width="1.8"/>
      <line x1="40" y1="52" x2="62" y2="50" stroke="#1E3A8A" stroke-width="1.8"/>
      <!-- 枪 -->
      <rect x="60" y="44" width="16" height="6" fill="#1F2937"/>
      <!-- 向上动作箭头 -->
      <path d="M 62 80 Q 66 60 60 50" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="40" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A">机位: 正面中景</text>
    </g>

    <!-- 段2 枪身旋转: 旋转枪身 -->
    <g transform="translate(475, 230)">
      <rect width="80" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" opacity="0.85"/>
      <!-- 旋转弧 -->
      <path d="M 20 60 A 25 25 0 1 1 60 60" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrBlue)"/>
      <!-- 枪身 -->
      <g transform="translate(40, 60) rotate(-25)">
        <rect x="-24" y="-3" width="48" height="7" fill="#1F2937" rx="1"/>
        <rect x="18" y="-6" width="8" height="4" fill="#6B7280"/>
      </g>
      <circle cx="40" cy="60" r="2" fill="#DC2626"/>
      <text x="40" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A">机位: 枪身特写</text>
    </g>

    <!-- 段3 瞄准镜 FPS: 圆圈 + 十字 -->
    <g transform="translate(733, 230)">
      <rect width="80" height="120" rx="6" fill="#0F172A" stroke="#1E3A8A" opacity="0.9"/>
      <circle cx="40" cy="60" r="38" fill="#FFFFFF" opacity="0.96"/>
      <circle cx="40" cy="60" r="38" fill="none" stroke="#1E40AF" stroke-width="2"/>
      <line x1="4" y1="60" x2="76" y2="60" stroke="#D4A853" stroke-width="0.8"/>
      <line x1="40" y1="24" x2="40" y2="96" stroke="#D4A853" stroke-width="0.8"/>
      <circle cx="40" cy="60" r="1.5" fill="#DC2626"/>
      <text x="40" y="112" text-anchor="middle" font-size="9" fill="#BFDBFE">机位: 第一人称瞄准</text>
    </g>

    <!-- 段4 收势回放: 慢动作回 -->
    <g transform="translate(964, 230)">
      <rect width="80" height="120" rx="6" fill="#FFFFFF" stroke="#6B7280" opacity="0.85"/>
      <!-- 回放箭头 -->
      <g transform="translate(40, 46)" fill="#374151">
        <polygon points="0,0 -14,-10 -14,10"/>
        <polygon points="14,0 0,-10 0,10"/>
      </g>
      <rect x="18" y="68" width="44" height="8" rx="2" fill="#6B7280"/>
      <rect x="18" y="68" width="22" height="8" rx="2" fill="#DC2626"/>
      <text x="40" y="96" text-anchor="middle" font-size="8.5" fill="#374151" font-family="'Consolas',monospace">REPLAY · 0.5x</text>
      <text x="40" y="112" text-anchor="middle" font-size="9" fill="#374151">机位: 第三人称拉远</text>
    </g>

    <!-- 摄像机位置 + FOV 标记节点 -->
    <!-- F1 -->
    <g>
      <line x1="84" y1="480" x2="84" y2="540" stroke="#1E3A8A" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="84" cy="480" r="7" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
      <circle cx="84" cy="548" r="16" fill="#1E3A8A"/>
      <text x="84" y="552" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="'Consolas',monospace">F1</text>
      <rect x="40" y="572" width="88" height="42" rx="5" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="84" y="590" text-anchor="middle" font-size="10" fill="#1E40AF" font-weight="700">机位: 正面</text>
      <text x="84" y="606" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A" font-family="'Consolas',monospace">FOV 75°</text>
    </g>

    <!-- F70 -->
    <g>
      <line x1="369" y1="480" x2="369" y2="520" stroke="#1E3A8A" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="369" cy="480" r="7" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
      <circle cx="369" cy="534" r="16" fill="#2563EB"/>
      <text x="369" y="538" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="'Consolas',monospace">F70</text>
      <rect x="325" y="556" width="88" height="42" rx="5" fill="#DBEAFE" stroke="#60A5FA"/>
      <text x="369" y="574" text-anchor="middle" font-size="10" fill="#1E40AF" font-weight="700">机位: 推近至胸</text>
      <text x="369" y="590" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A" font-family="'Consolas',monospace">FOV 55°</text>
    </g>

    <!-- F140 -->
    <g>
      <line x1="658" y1="480" x2="658" y2="540" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="658" cy="480" r="7" fill="#1E40AF" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="658" cy="558" r="16" fill="#1D4ED8"/>
      <text x="658" y="562" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="'Consolas',monospace">F140</text>
      <rect x="614" y="582" width="88" height="42" rx="5" fill="#1E3A8A" stroke="#3B82F6"/>
      <text x="658" y="600" text-anchor="middle" font-size="10" fill="#BFDBFE" font-weight="700">机位: 枪特写</text>
      <text x="658" y="616" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF" font-family="'Consolas',monospace">FOV 40°</text>
    </g>

    <!-- F195 -->
    <g>
      <line x1="885" y1="480" x2="885" y2="520" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="885" cy="480" r="7" fill="#111827" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="885" cy="540" r="16" fill="#111827"/>
      <text x="885" y="544" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="'Consolas',monospace">F195</text>
      <rect x="841" y="560" width="88" height="42" rx="5" fill="#F3F4F6" stroke="#1F2937"/>
      <text x="885" y="578" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="700">机位: 镜内瞄准</text>
      <text x="885" y="594" text-anchor="middle" font-size="12" font-weight="800" fill="#1F2937" font-family="'Consolas',monospace">FOV 18°</text>
    </g>

    <!-- F252 -->
    <g>
      <line x1="1120" y1="480" x2="1120" y2="540" stroke="#374151" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="1120" cy="480" r="7" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
      <circle cx="1120" cy="558" r="16" fill="#6B7280"/>
      <text x="1120" y="562" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="'Consolas',monospace">F252</text>
      <rect x="1076" y="582" width="88" height="42" rx="5" fill="#F9FAFB" stroke="#9CA3AF"/>
      <text x="1120" y="600" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="700">机位: 拉远结束</text>
      <text x="1120" y="616" text-anchor="middle" font-size="12" font-weight="800" fill="#374151" font-family="'Consolas',monospace">FOV 65°</text>
    </g>

    <!-- FOV 连接折线 (在上方显示趋势) -->
    <polyline points="84,238 369,278 658,300 885,330 1120,262"
              fill="none" stroke="#D4A853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/>
    <!-- 线上标签 -->
    <text x="100" y="232" font-size="9.5" fill="#92400E" font-weight="700">75°</text>
    <text x="380" y="272" font-size="9.5" fill="#92400E" font-weight="700">55°</text>
    <text x="640" y="294" font-size="9.5" fill="#FFFFFF" font-weight="700">40°</text>
    <text x="870" y="324" font-size="9.5" fill="#FFFFFF" font-weight="700">18°</text>
    <text x="1090" y="256" font-size="9.5" fill="#92400E" font-weight="700">65°</text>
    <text x="600" y="230" text-anchor="middle" font-size="11" fill="#92400E" font-weight="700">— FOV 过渡趋势线 —</text>
  </g>

  <!-- 底部主时间轴刻度 -->
  <g transform="translate(80, 650)" font-size="11" fill="#6B7280">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#4A7CC9" stroke-width="2.5" marker-end="url(#arr)"/>
    <!-- 刻度每 42F 左右 -->
    <g>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F2937" stroke-width="2"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F0</text>
    </g>
    <g transform="translate(173)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4A7CC9"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F42</text>
    </g>
    <g transform="translate(347)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F2937" stroke-width="1.5"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F84</text>
    </g>
    <g transform="translate(520)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4A7CC9"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F126</text>
    </g>
    <g transform="translate(694)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F2937" stroke-width="1.5"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F168</text>
    </g>
    <g transform="translate(867)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4A7CC9"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F210</text>
    </g>
    <g transform="translate(1040)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F2937" stroke-width="2"/>
      <text x="0" y="28" text-anchor="middle" font-family="'Consolas',monospace">F252</text>
    </g>
    <text x="520" y="56" text-anchor="middle" font-size="10" fill="#6B7280">Ultimate Timeline · 帧 (Frame)  @60 FPS  ·  单位 ms = F ÷ 60 × 1000</text>
  </g>

  <!-- 底部阶段时长汇总 -->
  <g transform="translate(80, 710)" font-size="12" fill="#1F2937">
    <rect width="1040" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <g transform="translate(16, 23)" font-family="'Consolas',monospace">
      <text x="0" y="0" fill="#1E40AF" font-weight="700">① F1-F70: 70F=1.17s</text>
      <text x="190" y="0" fill="#1E40AF" font-weight="700">② F71-F140: 70F=1.17s</text>
      <text x="380" y="0" fill="#1E3A8A" font-weight="700">③ F141-F195: 55F=0.92s</text>
      <text x="560" y="0" fill="#374151" font-weight="700">④ F196-F252: 57F=0.95s</text>
      <text x="750" y="0" fill="#6B7280">FOV 路径: 75→55→40→18→65° (Zoom 后拉回)</text>
      <text x="990" y="0" fill="#DC2626" font-weight="700">Σ 4.21s</text>
    </g>
  </g>
</svg>
