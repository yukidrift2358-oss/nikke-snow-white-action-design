<text x="1180" y="460" fill="#64748B" font-size="10">FX_MuzzleSmoke_01 × 2</text>
<rect x="904" y="504" width="760" height="150" rx="10" fill="#991B1B" fill-opacity="0.08" stroke="#E2E8F0"/>
<text x="920" y="524" fill="#991B1B" font-size="12" font-weight="700">B2 · 互斥规则（Pri 覆盖逻辑）</text>
<text x="920" y="554" fill="#334155" font-size="10.5">1. MB 优先级 8 ≥ PB 4：激活期间，PB_Rifle_L 与 PB_Rifle_R 阻挡框临时关闭，防止子弹反弹回穿；</text>
<text x="920" y="576" fill="#334155" font-size="10.5">2. HB 同位置不受影响：受击 15 组常态判定持续有效，不与 MB/PB 冲突；</text>
<text x="920" y="598" fill="#334155" font-size="10.5">3. AB_AimAssist 锥面（Pri 2）持续激活：不参与命中结算，仅用于玩家吸附；</text>
<text x="920" y="620" fill="#334155" font-size="10.5">4. 2F 激活结束帧 F+2 同时执行：MB 关 + PB 恢复（+1F 后恢复），避免 1F 空窗穿透；</text>
<text x="920" y="642" fill="#334155" font-size="10.5">5. 近身余波 5%：距离角色 ≤2m 目标额外追加；与 MB 中心同帧同位置生效。</text>
