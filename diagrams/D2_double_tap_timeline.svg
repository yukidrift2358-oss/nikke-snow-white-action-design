<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7FA9E8"/>
      <stop offset="50%" stop-color="#4A7CC9"/>
      <stop offset="100%" stop-color="#2F5B9E"/>
    </linearGradient>
    <linearGradient id="cancelGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FDE8E8"/>
      <stop offset="100%" stop-color="#F5B8B8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#4A7CC9"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="28" font-weight="700" fill="url(#titleGrad)">D2 双点射时间轴 · Double Tap Timeline</text>
  <text x="60" y="78" font-size="14" fill="#6B7280">战术步枪两发短点射动画事件序列 · 60FPS 单位帧 (F) · 0~30F 全流程</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 图例 -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="22" height="14" fill="url(#barGrad)" stroke="#2F5B9E"/>
    <text x="30" y="12" font-size="12" fill="#1F2937">射击发射帧</text>
    <rect x="140" y="0" width="22" height="14" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="170" y="12" font-size="12" fill="#1F2937">前摇 Windup</text>
    <rect x="290" y="0" width="22" height="14" fill="url(#cancelGrad)" stroke="#DC2626"/>
    <text x="320" y="12" font-size="12" fill="#1F2937">可取消窗口 Cancelable</text>
    <rect x="490" y="0" width="22" height="14" fill="#F3F4F6" stroke="#D1D5DB"/>
    <text x="520" y="12" font-size="12" fill="#1F2937">后摇 Recovery</text>
  </g>

  <!-- 时间轴坐标: 100 + F*34, 但 0~30F 对应 x=100..1120, 步长 34px/F -->
  <!-- 轴区域 y: 220 -->
  <g>
    <!-- 前摇区背景 F1-F8 -->
    <rect x="100" y="200" width="272" height="260" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-dasharray="4 3" opacity="0.75"/>
    <text x="236" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">前摇 Windup  ·  F1 ~ F8</text>

    <!-- 后摇区背景 F13-F30 -->
    <rect x="544" y="200" width="612" height="260" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-dasharray="4 3" opacity="0.75"/>
    <text x="850" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">后摇 Recovery  ·  F13 ~ F30</text>

    <!-- 射击区高亮 F9-F12 -->
    <rect x="372" y="200" width="170" height="260" rx="6" fill="#FFF7E6" stroke="#D4A853" stroke-width="1.5" opacity="0.85"/>
    <text x="457" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">双点射窗口  ·  F9 ~ F12</text>

    <!-- 主时间轴 -->
    <line x1="100" y1="460" x2="1156" y2="460" stroke="#4A7CC9" stroke-width="3" marker-end="url(#arrowEnd)"/>

    <!-- 刻度 0~30 每 5F -->
    <g font-size="11" fill="#6B7280" text-anchor="middle">
      <g>
        <line x1="100" y1="460" x2="100" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="100" y="488">F0</text>
      </g>
      <g>
        <line x1="270" y1="460" x2="270" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="270" y="488">F5</text>
      </g>
      <g>
        <line x1="440" y1="460" x2="440" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="440" y="488">F10</text>
      </g>
      <g>
        <line x1="610" y1="460" x2="610" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="610" y="488">F15</text>
      </g>
      <g>
        <line x1="780" y1="460" x2="780" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="780" y="488">F20</text>
      </g>
      <g>
        <line x1="950" y1="460" x2="950" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="950" y="488">F25</text>
      </g>
      <g>
        <line x1="1120" y1="460" x2="1120" y2="470" stroke="#4A7CC9" stroke-width="2"/>
        <text x="1120" y="488">F30</text>
      </g>
    </g>

    <!-- 双点射两发蓝色竖条  F9/F10 + F11/F12 -->
    <!-- 每帧宽 34. F9@406, F10@440, F11@474, F12@508 -->
    <!-- 第一发 F9/F10 合并 -->
    <g filter="url(#softGlow)">
      <rect x="400" y="260" width="70" height="180" rx="5" fill="url(#barGrad)" stroke="#2F5B9E" stroke-width="1.5"/>
      <!-- 高光 -->
      <rect x="404" y="264" width="16" height="172" rx="3" fill="#FFFFFF" opacity="0.35"/>
      <text x="435" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">第 1 发</text>
      <text x="435" y="365" text-anchor="middle" font-size="11" fill="#DBEAFE">F9 / F10</text>
    </g>
    <!-- 第二发 F11/F12 -->
    <g filter="url(#softGlow)">
      <rect x="472" y="260" width="70" height="180" rx="5" fill="url(#barGrad)" stroke="#2F5B9E" stroke-width="1.5"/>
      <rect x="476" y="264" width="16" height="172" rx="3" fill="#FFFFFF" opacity="0.35"/>
      <text x="507" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">第 2 发</text>
      <text x="507" y="365" text-anchor="middle" font-size="11" fill="#DBEAFE">F11 / F12</text>
    </g>

    <!-- 事件标记: 上方 F8 OnSound -->
    <g>
      <line x1="372" y1="260" x2="372" y2="160" stroke="#D4A853" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="372" cy="160" r="6" fill="#D4A853"/>
      <text x="372" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">F8  OnSound</text>
    </g>
    <!-- F9 OnMuzzleFlash_L -->
    <g>
      <line x1="406" y1="260" x2="406" y2="180" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="406" cy="180" r="6" fill="#DC2626"/>
      <text x="420" y="168" font-size="12" font-weight="700" fill="#DC2626">F9  OnMuzzleFlash_L</text>
    </g>
    <!-- F10 OnProjectile_1 -->
    <g>
      <line x1="440" y1="260" x2="440" y2="152" stroke="#4A7CC9" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="440" cy="152" r="6" fill="#4A7CC9"/>
      <text x="454" y="140" font-size="12" font-weight="700" fill="#4A7CC9">F10  OnProjectile_1</text>
    </g>
    <!-- F11 OnMuzzleFlash_L -->
    <g>
      <line x1="474" y1="260" x2="474" y2="180" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="474" cy="180" r="6" fill="#DC2626"/>
      <text x="488" y="168" font-size="12" font-weight="700" fill="#DC2626">F11  OnMuzzleFlash_L</text>
    </g>
    <!-- F12 OnProjectile_2 -->
    <g>
      <line x1="508" y1="260" x2="508" y2="152" stroke="#4A7CC9" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="508" cy="152" r="6" fill="#4A7CC9"/>
      <text x="522" y="140" font-size="12" font-weight="700" fill="#4A7CC9">F12  OnProjectile_2</text>
    </g>
  </g>

  <!-- 取消窗口 F20 -->
  <g>
    <!-- 可取消起始 F20 -->
    <rect x="776" y="510" width="354" height="70" rx="8" fill="url(#cancelGrad)" stroke="#DC2626" stroke-width="1.5" opacity="0.9"/>
    <line x1="780" y1="460" x2="780" y2="510" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3 2"/>
    <polygon points="772,506 788,506 780,518" fill="#DC2626"/>
    <text x="953" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">可 Cancel 起始 · F20 之后接受打断指令</text>
    <text x="953" y="558" text-anchor="middle" font-size="11" fill="#7F1D1D">支持: 冲刺 / 换弹 / 切枪 / 技能 / 下蹲</text>
    <text x="780" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">F20</text>
  </g>

  <!-- 底部说明表格 -->
  <g transform="translate(60, 610)">
    <rect width="1080" height="90" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <g font-size="12">
      <g transform="translate(20, 24)">
        <circle cx="0" cy="0" r="5" fill="#D4A853"/>
        <text x="14" y="4" font-weight="700" fill="#1F2937">总时长 30F = 500ms</text>
        <text x="230" y="4" fill="#6B7280">@60FPS 标准动画速率</text>
      </g>
      <g transform="translate(20, 48)">
        <circle cx="0" cy="0" r="5" fill="#4A7CC9"/>
        <text x="14" y="4" font-weight="700" fill="#1F2937">前摇 8F (133ms) · 不可取消  |  双点射 4F (66ms) · 两发间隔 2F  |  后摇 18F (300ms) · F20 起可打断</text>
      </g>
      <g transform="translate(20, 72)">
        <circle cx="0" cy="0" r="5" fill="#DC2626"/>
        <text x="14" y="4" font-weight="700" fill="#1F2937">事件发射顺序: 音效(F8) → 枪口火焰(F9/F11) → 抛射物生成(F10/F12)  · 命中检测绑定 OnProjectile 回调</text>
      </g>
    </g>
  </g>
</svg>
